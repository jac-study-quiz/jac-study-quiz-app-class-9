<!DOCTYPE html>
<html>
<head>
<title>JAC Class 9 Quiz</title>
<style>
body{font-family:Arial;text-align:center;background:#eef2ff}
.quiz-box{background:white;padding:20px;max-width:500px;margin:50px auto;border-radius:10px}
button{padding:10px 20px;background:blue;color:white;border:none;border-radius:5px}
</style>
</head>
<body>
<div class="quiz-box">
<h1>JAC Board Class 9 Quiz</h1>
<p id="question">Science: Prakash ka pravartan kya hai?</p>
<button onclick="check()">A) Light ka mudna</button>
<button onclick="check()">B) Light ka rukna</button>
<p id="result"></p>
</div>
<script>
function check(){ document.getElementById('result').innerText = "Sahi Jawab! A"; }
</script>
</body>
</html>
