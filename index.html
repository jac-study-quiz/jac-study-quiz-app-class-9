 <!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAC Board Class 9 - Full Study Quiz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f1f5f9;color:#0f172a}
header{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;padding:22px 16px;text-align:center}
.container{max-width:480px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.08);padding:18px;margin-bottom:16px}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sub-btn{border:0;padding:18px 10px;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer;color:#fff}
.science{background:#16a34a}.maths{background:#2563eb}.sst{background:#db2777}.hindi{background:#ea580c}.english{background:#7c3aed}
.meta{display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin:12px 0}
.q{font-size:18px;font-weight:700;margin:10px 0 14px}
.opt{width:100%;text-align:left;padding:14px;border:2px solid #e2e8f0;border-radius:12px;margin:8px 0;background:#fff;font-size:15px;cursor:pointer}
.opt.correct{background:#dcfce7;border-color:#16a34a}.opt.wrong{background:#fee2e2;border-color:#ef4444}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#1e40af;color:#fff;font-weight:700;font-size:16px;cursor:pointer;margin-top:12px}
.hidden{display:none} .big{font-size:42px;font-weight:800;color:#1e40af;text-align:center}
</style>
</head>
<body>
<header><h1>JAC Board Class 9 Quiz</h1><p>झारखंड बोर्ड - Complete App</p></header>
<div class="container">
<div id="home" class="card"><h3>Subject Chuniye 👇</h3><div class="subjects"><button class="sub-btn science" onclick="startQuiz('science')">Science</button><button class="sub-btn maths" onclick="startQuiz('maths')">Maths</button><button class="sub-btn sst" onclick="startQuiz('sst')">SST</button><button class="sub-btn hindi" onclick="startQuiz('hindi')">Hindi</button><button class="sub-btn english" style="grid-column:span 2" onclick="startQuiz('english')">English</button></div></div>
<div id="quiz" class="card hidden"><div class="meta"><span id="qCount"></span><span id="qSub"></span></div><div id="question" class="q"></div><div id="options"></div><button id="nextBtn" class="btn hidden" onclick="nextQ()">Next →</button></div>
<div id="result" class="card hidden"><div class="big" id="scoreText"></div><p id="msg" style="text-align:center;margin:10px 0"></p><button class="btn" onclick="location.reload()">Home</button></div>
</div>
<script>
const data={science:[{q:"प्रकाश संश्लेषण कहाँ होता है?",o:["जड़","पत्ती","तना","फूल"],a:1},{q:"बल का SI मात्रक?",o:["जूल","न्यूटन","वाट","पास्कल"],a:1},{q:"कोशिका का पावर हाउस?",o:["न्यूक्लियस","माइटोकॉन्ड्रिया","राइबोसोम","क्लोरोप्लास्ट"],a:1}],maths:[{q:"(a+b)²=?",o:["a²+b²","a²+2ab+b²","a²-2ab+b²","ab"],a:1},{q:"त्रिभुज के कोणों का योग?",o:["90°","180°","360°","270°"],a:1}],sst:[{q:"संविधान कब लागू हुआ?",o:["15 Aug 1947","26 Jan 1950","2 Oct 1949","26 Nov 1949"],a:1},{q:"झारखंड कब बना?",o:["2000","1998","2001","2005"],a:0}],hindi:[{q:"रामचरितमानस के लेखक?",o:["सूरदास","तुलसीदास","कबीर","प्रेमचंद"],a:1}],english:[{q:"He ___ to school daily.",o:["go","goes","going","gone"],a:1}]};
let curSub,curQs,idx=0,score=0,locked=false;
function startQuiz(sub){curSub=sub;curQs=data[sub];idx=0;score=0;document.getElementById('home').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');document.getElementById('qSub').innerText=sub;showQ();}
function showQ(){locked=false;let q=curQs[idx];document.getElementById('qCount').innerText=`Q ${idx+1}/${curQs.length}`;document.getElementById('question').innerText=q.q;let h='';q.o.forEach((op,i)=>{h+=`<button class=opt onclick=check(this,${i})>${op}</button>`});document.getElementById('options').innerHTML=h;document.getElementById('nextBtn').classList.add('hidden');}
function check(el,i){if(locked)return;locked=true;let q=curQs[idx];if(i===q.a){el.classList.add('correct');score++;}else{el.classList.add('wrong');document.querySelectorAll('.opt')[q.a].classList.add('correct');}document.getElementById('nextBtn').classList.remove('hidden');}
function nextQ(){idx++;if(idx<curQs.length)showQ();else{document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('scoreText').innerText=`${score}/${curQs.length}`;document.getElementById('msg').innerText=score>=2?"बहुत बढ़िया! 🔥":"और मेहनत करो 💪";}}
</script>
</body>
</html>
